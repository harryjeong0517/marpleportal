<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MARPLE 통합 포털</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='20' width='52' height='24' rx='12' fill='none' stroke='%23009BDF' stroke-width='8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --blue: #009BDF;
    --blue-deep: #0086C6;
    --ink: #000000;
    --mute: #6B7C86;
    --paper: #FFFFFF;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; height: 100%; }

  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ───────── 무대: 로고의 타원이 바깥으로 번져 나가는 배경 ───────── */
  .stage {
    position: relative;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(40px, 9vh, 96px) clamp(20px, 4.2vw, 56px) 28px;
    overflow: hidden;
    overflow: clip;
    isolation: isolate;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(0, 155, 223, .10) 0%, rgba(0, 155, 223, 0) 62%),
      linear-gradient(180deg, #FFFFFF 0%, #F4FAFD 100%);
  }

  .brand {
    position: relative;
    width: clamp(210px, 24vw, 312px);
    aspect-ratio: 312 / 50;
  }
  .brand svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .brand .echo { z-index: -1; pointer-events: none; }

  .echo rect {
    fill: none;
    stroke: var(--blue);
    opacity: var(--o);
    transform-origin: 160px 26px;
    animation: echo 1.5s cubic-bezier(.2, .7, .2, 1) backwards;
    animation-delay: calc(var(--i) * 85ms);
  }
  .echo .hair { stroke-width: 1.25px; vector-effect: non-scaling-stroke; }
  .echo .tilt { transform-box: fill-box; transform-origin: center; transform: rotate(var(--r)); animation-name: echo-tilt; }

  @keyframes echo {
    from { opacity: 0; transform: scale(.9); }
    to   { opacity: var(--o); transform: scale(1); }
  }
  @keyframes echo-tilt {
    from { opacity: 0; transform: rotate(var(--r)) scale(.94); }
    to   { opacity: var(--o); transform: rotate(var(--r)) scale(1); }
  }

  h1 {
    margin: clamp(18px, 3.2vh, 30px) 0 0;
    font-size: clamp(30px, 3.5vw, 46px);
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.15;
  }

  /* ───────── 세 개의 입구 ───────── */
  .doors {
    width: 100%;
    max-width: 1200px;
    margin: clamp(36px, 8vh, 76px) auto 0;
    padding: 0;
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(16px, 3.6vw, 48px);
  }

  .door {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    aspect-ratio: 1 / 1;
    padding: 24px;
    border-radius: clamp(34px, 5.4vw, 72px);
    overflow: hidden;
    color: #fff;
    text-decoration: none;
    text-align: center;
    background: linear-gradient(155deg, #0BA6EA 0%, var(--blue) 46%, var(--blue-deep) 100%);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .35) inset,
      0 2px 4px rgba(0, 92, 138, .18),
      0 22px 44px -18px rgba(0, 110, 165, .55);
    transition: transform .35s cubic-bezier(.2, .7, .2, 1), box-shadow .35s cubic-bezier(.2, .7, .2, 1);
  }

  .door .motif {
    position: absolute;
    right: 0;
    bottom: 0;
    height: 100%;
    aspect-ratio: 1 / 1;
    pointer-events: none;
    transition: transform .6s cubic-bezier(.2, .7, .2, 1);
  }
  .door .motif * { fill: none; stroke: #fff; }

  .door .name {
    position: relative;
    font-size: clamp(19px, 1.95vw, 26px);
    font-weight: 700;
    letter-spacing: 0.005em;
    line-height: 1.2;
  }
  .door .about {
    position: relative;
    font-size: clamp(13px, 1.1vw, 15px);
    font-weight: 500;
    opacity: .82;
  }

  .door:hover,
  .door:focus-visible {
    transform: translateY(-6px);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, .35) inset,
      0 4px 8px rgba(0, 92, 138, .18),
      0 34px 56px -20px rgba(0, 110, 165, .62);
  }
  .door:hover .motif,
  .door:focus-visible .motif { transform: translate(-4%, -4%) scale(1.05); }
  .door:active { transform: translateY(-2px); }
  .door:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }

  footer {
    margin-top: auto;
    padding-top: clamp(32px, 6vh, 64px);
    font-size: 13px;
    color: var(--mute);
    letter-spacing: 0.01em;
  }

  /* ───────── 좁은 화면: 세로로 쌓기 ───────── */
  @media (max-width: 760px) {
    .doors { grid-template-columns: 1fr; gap: 14px; max-width: 480px; }
    .door { aspect-ratio: auto; min-height: 128px; border-radius: 34px; gap: 6px; }
    .door .name { font-size: 21px; }
    .door .about { font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .echo rect { animation: none; }
    .door, .door .motif { transition: none; }
    .door:hover, .door:focus-visible { transform: none; }
    .door:hover .motif, .door:focus-visible .motif { transform: none; }
  }
</style>
</head>
